<title>Phantom Config</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Dark-first game config dashboard — single committed dark theme */
:root {
  --bg-deep: #0a0a0c;
  --bg-panel: #111115;
  --bg-card: #18181e;
  --bg-input: #1e1e26;
  --bg-hover: #24242e;
  --border: #2a2a35;
  --border-active: #3a3a48;
  --fg: #e8e8ed;
  --fg-dim: #8888a0;
  --fg-muted: #55556a;
  --accent: #e63946;
  --accent-glow: rgba(230, 57, 70, 0.25);
  --accent-soft: rgba(230, 57, 70, 0.12);
  --green: #2ecc71;
  --yellow: #f1c40f;
  --blue: #3498db;
  --radius: 8px;
  --radius-sm: 5px;
  --font: 'Inter', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', monospace;
  color-scheme: dark;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { height: 100%; }
body {
  height: 100%;
  background: var(--bg-deep);
  color: var(--fg);
  font-family: var(--font);
  font-size: 13px;
  line-height: 1.5;
  overflow: hidden;
  padding-left: max(0px, env(safe-area-inset-left, 0px));
  padding-right: max(0px, env(safe-area-inset-right, 0px));
}

#app {
  display: grid;
  grid-template-columns: 220px 1fr;
  grid-template-rows: 52px 1fr 36px;
  height: 100%;
  gap: 0;
}

/* Top bar */
.topbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  gap: 16px;
  -webkit-app-region: drag;
}
.topbar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.02em;
}
.topbar-brand svg { flex-shrink: 0; }
.topbar-brand span { color: var(--accent); }

.search-box {
  flex: 1;
  max-width: 360px;
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 7px 12px 7px 34px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--fg);
  font-family: var(--font);
  font-size: 12px;
  outline: none;
  transition: border-color 0.2s;
}
.search-box input:focus { border-color: var(--accent); }
.search-box input::placeholder { color: var(--fg-muted); }
.search-box svg {
  position: absolute; left: 10px; top: 50%;
  transform: translateY(-50%);
  color: var(--fg-muted);
  pointer-events: none;
}

.topbar-actions {
  display: flex; align-items: center; gap: 8px;
}
.topbar-btn {
  padding: 5px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--fg-dim);
  font-family: var(--font);
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.topbar-btn:hover { border-color: var(--border-active); color: var(--fg); }
.topbar-btn.accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.topbar-btn.accent:hover { filter: brightness(1.1); }

/* Sidebar */
.sidebar {
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  padding: 12px 0;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.sidebar-section {
  padding: 0 12px;
  margin-bottom: 4px;
}
.sidebar-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--fg-muted);
  padding: 8px 12px 6px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
  color: var(--fg-dim);
  font-size: 13px;
  font-weight: 450;
  user-select: none;
}
.nav-item:hover { background: var(--bg-hover); color: var(--fg); }
.nav-item.active {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 550;
}
.nav-item svg { flex-shrink: 0; opacity: 0.7; }
.nav-item.active svg { opacity: 1; }

.sidebar-footer {
  margin-top: auto;
  padding: 12px;
  border-top: 1px solid var(--border);
}
.config-select {
  width: 100%;
  padding: 7px 10px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--fg);
  font-family: var(--font);
  font-size: 12px;
  outline: none;
  cursor: pointer;
}
.config-select:focus { border-color: var(--accent); }

/* Main content */
.main {
  overflow-y: auto;
  padding: 20px 24px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

/* Sub-tabs */
.subtabs {
  display: flex;
  gap: 2px;
  margin-bottom: 20px;
  background: var(--bg-input);
  border-radius: var(--radius);
  padding: 3px;
  width: fit-content;
}
.subtab {
  padding: 6px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  color: var(--fg-dim);
  transition: all 0.15s;
  user-select: none;
}
.subtab:hover { color: var(--fg); }
.subtab.active {
  background: var(--accent);
  color: #fff;
}

/* Settings grid */
.settings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 16px;
}

.settings-group {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  cursor: pointer;
  user-select: none;
  border-bottom: 1px solid var(--border);
}
.group-title {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--fg);
}
.group-header svg {
  color: var(--fg-muted);
  transition: transform 0.2s;
}
.group-header.collapsed svg { transform: rotate(-90deg); }
.group-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
.group-body.hidden { display: none; }

/* Setting row */
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 28px;
}
.setting-label {
  font-size: 12.5px;
  color: var(--fg-dim);
  white-space: nowrap;
}

/* Toggle */
.toggle {
  position: relative;
  width: 38px;
  height: 20px;
  flex-shrink: 0;
}
.toggle input { display: none; }
.toggle-track {
  width: 100%;
  height: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
}
.toggle-track::after {
  content: '';
  position: absolute;
  left: 3px; top: 3px;
  width: 12px; height: 12px;
  background: var(--fg-muted);
  border-radius: 50%;
  transition: all 0.2s;
}
.toggle input:checked + .toggle-track {
  background: var(--accent);
  border-color: var(--accent);
}
.toggle input:checked + .toggle-track::after {
  left: 21px;
  background: #fff;
}

/* Slider */
.slider-wrap {
  display: flex;
  flex-direction: column;
  gap: 6px;
  width: 100%;
}
.slider-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.slider-value {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent);
  font-weight: 500;
}
.slider-track {
  position: relative;
  width: 100%;
  height: 6px;
  background: var(--bg-input);
  border-radius: 3px;
  cursor: pointer;
}
.slider-fill {
  position: absolute;
  left: 0; top: 0;
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 0.05s;
}
.slider-thumb {
  position: absolute;
  top: 50%;
  width: 14px; height: 14px;
  background: #fff;
  border: 2px solid var(--accent);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  cursor: grab;
  transition: box-shadow 0.15s;
  z-index: 1;
}
.slider-thumb:hover { box-shadow: 0 0 0 4px var(--accent-glow); }

/* Dropdown */
.dropdown {
  position: relative;
  min-width: 120px;
}
.dropdown-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 5px 10px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--fg);
  font-family: var(--font);
  font-size: 12px;
  cursor: pointer;
  transition: border-color 0.15s;
  width: 100%;
}
.dropdown-btn:hover { border-color: var(--border-active); }
.dropdown-menu {
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px;
  z-index: 100;
  display: none;
}
.dropdown-menu.open { display: block; }
.dropdown-option {
  padding: 6px 10px;
  font-size: 12px;
  color: var(--fg-dim);
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.1s;
}
.dropdown-option:hover { background: var(--bg-hover); color: var(--fg); }
.dropdown-option.selected { color: var(--accent); }

/* Color picker */
.color-swatch {
  width: 28px; height: 28px;
  border-radius: var(--radius-sm);
  border: 2px solid var(--border);
  cursor: pointer;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;
}
.color-swatch input[type="color"] {
  position: absolute;
  inset: -4px;
  width: calc(100% + 8px);
  height: calc(100% + 8px);
  border: none;
  cursor: pointer;
  opacity: 0;
}

/* Keybind */
.keybind-btn {
  padding: 4px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  color: var(--fg-dim);
  font-family: var(--mono);
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
  min-width: 60px;
  text-align: center;
}
.keybind-btn:hover { border-color: var(--accent); }
.keybind-btn.listening {
  border-color: var(--accent);
  color: var(--accent);
  animation: pulse 1s infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 var(--accent-glow); }
  50% { box-shadow: 0 0 0 6px transparent; }
}

/* Status bar */
.statusbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: var(--bg-panel);
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--fg-muted);
  gap: 16px;
}
.statusbar-left, .statusbar-right {
  display: flex; align-items: center; gap: 12px;
}
.status-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
}
.status-dot.warn { background: var(--yellow); }
.status-dot.off { background: var(--fg-muted); }

/* Toast */
.toast {
  position: fixed;
  bottom: 52px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  padding: 8px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 12px;
  color: var(--fg);
  opacity: 0;
  transition: all 0.3s;
  z-index: 1000;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { border-color: var(--green); }
.toast.error { border-color: var(--accent); }

/* Responsive */
@media (max-width: 700px) {
  #app {
    grid-template-columns: 1fr;
    grid-template-rows: 52px auto 1fr 36px;
  }
  .sidebar {
    flex-direction: row;
    overflow-x: auto;
    border-right: none;
    border-bottom: 1px solid var(--border);
    padding: 6px 8px;
    gap: 4px;
  }
  .sidebar-section { display: flex; gap: 4px; padding: 0; margin: 0; }
  .sidebar-label { display: none; }
  .sidebar-footer { display: none; }
  .nav-item { padding: 6px 12px; font-size: 12px; white-space: nowrap; }
  .main { padding: 16px; }
  .settings-grid { grid-template-columns: 1fr; }
}
</style>

<div id="app">
  <!-- Top Bar -->
  <div class="topbar">
    <div class="topbar-brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="var(--accent)"/>
        <path d="M2 17l10 5 10-5" opacity="0.5"/>
        <path d="M2 12l10 5 10-5" opacity="0.7"/>
      </svg>
      <span>PHANTOM</span> CONFIG
    </div>
    <div class="search-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" placeholder="Search settings..." id="searchInput">
    </div>
    <div class="topbar-actions">
      <button class="topbar-btn" onclick="resetConfig()">Reset</button>
      <button class="topbar-btn" onclick="exportConfig()">Export</button>
      <button class="topbar-btn" onclick="importConfig()">Import</button>
      <button class="topbar-btn accent" onclick="saveConfig()">Save</button>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-label">Modules</div>
      <div class="nav-item active" data-page="combat" onclick="switchPage(this)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Combat
      </div>
      <div class="nav-item" data-page="visual" onclick="switchPage(this)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        Visual
      </div>
      <div class="nav-item" data-page="movement" onclick="switchPage(this)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        Movement
      </div>
      <div class="nav-item" data-page="world" onclick="switchPage(this)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        World
      </div>
      <div class="nav-item" data-page="automation" onclick="switchPage(this)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20V10M6 20V4M18 20v-6"/></svg>
        Automation
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">System</div>
      <div class="nav-item" data-page="settings" onclick="switchPage(this)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Settings
      </div>
    </div>
    <div class="sidebar-footer">
      <select class="config-select" id="configSlot" onchange="loadConfig(this.value)">
        <option value="default">Default Profile</option>
        <option value="profile1">Profile 1</option>
        <option value="profile2">Profile 2</option>
        <option value="profile3">Profile 3</option>
      </select>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main" id="mainContent"></div>

  <!-- Status Bar -->
  <div class="statusbar">
    <div class="statusbar-left">
      <span style="display:flex;align-items:center;gap:6px"><span class="status-dot" id="statusDot"></span><span id="statusText">Ready</span></span>
      <span style="color:var(--fg-muted)">|</span>
      <span id="activeCount">0 active</span>
    </div>
    <div class="statusbar-right">
      <span id="configName">Default Profile</span>
      <span style="color:var(--fg-muted)">|</span>
      <span>Auto-save: <span id="autoSaveState" style="color:var(--green)">ON</span></span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const PAGES = {
  combat: {
    subtabs: ['Aim Assist', 'Tracking', 'Trigger'],
    sections: {
      'Aim Assist': [
        { group: 'Aim Assist', settings: [
          { id: 'aimAssist', label: 'Aim Assist', type: 'toggle', default: false },
          { id: 'aimMode', label: 'Mode', type: 'dropdown', options: ['None','Closest','Lowest HP','Random'], default: 'None' },
          { id: 'smoothness', label: 'Smoothness', type: 'slider', min: 1, max: 100, default: 60 },
          { id: 'fovSize', label: 'FOV Size', type: 'slider', min: 10, max: 500, default: 150 },
          { id: 'hitPart', label: 'Hit Part', type: 'dropdown', options: ['Head','Torso','Random'], default: 'Random' },
          { id: 'showFov', label: 'Show FOV Circle', type: 'toggle', default: false },
          { id: 'teamCheck', label: 'Team Check', type: 'toggle', default: true },
          { id: 'wallCheck', label: 'Wall Check', type: 'toggle', default: true },
        ]},
        { group: 'Weapon Mods', settings: [
          { id: 'noSpread', label: 'No Bullet Spread', type: 'toggle', default: false },
          { id: 'rapidFire', label: 'Rapid Fire', type: 'toggle', default: false },
          { id: 'noCooldown', label: 'No Cooldown', type: 'toggle', default: false },
        ]},
      ],
      'Tracking': [
        { group: 'Tracking', settings: [
          { id: 'trackingEnabled', label: 'Tracking', type: 'toggle', default: false },
          { id: 'trackMode', label: 'Mode', type: 'dropdown', options: ['None','Sticky','Predictive'], default: 'None' },
          { id: 'trackWeapon', label: 'Weapon', type: 'dropdown', options: ['Auto','Primary','Secondary'], default: 'Auto' },
          { id: 'heightOffset', label: 'Height Above Target', type: 'slider', min: 0, max: 15, default: 4 },
          { id: 'stability', label: 'Stability', type: 'slider', min: 0, max: 100, step: 1, default: 15 },
        ]},
      ],
      'Trigger': [
        { group: 'Trigger', settings: [
          { id: 'triggerEnabled', label: 'Trigger', type: 'toggle', default: false },
          { id: 'triggerMode', label: 'Mode', type: 'dropdown', options: ['None','On Sight','On Scope'], default: 'None' },
          { id: 'reactionDelay', label: 'Reaction Delay (s)', type: 'slider', min: 0, max: 200, default: 0, step: 10 },
          { id: 'releaseDelay', label: 'Release Delay (s)', type: 'slider', min: 0, max: 200, default: 0, step: 10 },
          { id: 'triggerTarget', label: 'Target', type: 'dropdown', options: ['Any','Enemy','Nearest'], default: 'Any' },
          { id: 'onlyScoped', label: 'Only When Scoped', type: 'toggle', default: false },
        ]},
      ],
    }
  },
  visual: {
    subtabs: ['ESP', 'Effects', 'Overlays'],
    sections: {
      'ESP': [
        { group: 'ESP', settings: [
          { id: 'espEnabled', label: 'Enable ESP', type: 'toggle', default: false },
          { id: 'espHighlight', label: 'Highlight', type: 'toggle', default: false },
          { id: 'highlightMethod', label: 'Highlight Method', type: 'dropdown', options: ['Highlight','Outline','Glow'], default: 'Highlight' },
          { id: 'espBox', label: 'Box', type: 'toggle', default: false },
          { id: 'espNames', label: 'Names', type: 'toggle', default: false },
          { id: 'espHealthBar', label: 'Health Bar', type: 'toggle', default: false },
          { id: 'espHealthText', label: 'Health Text', type: 'toggle', default: false },
          { id: 'espDistance', label: 'Distance', type: 'toggle', default: false },
          { id: 'espSkeleton', label: 'Skeleton', type: 'toggle', default: false },
          { id: 'espMaxDist', label: 'Max Distance', type: 'slider', min: 50, max: 1000, default: 500 },
          { id: 'espTextSize', label: 'Text Size', type: 'slider', min: 8, max: 24, default: 13 },
        ]},
        { group: 'ESP Colors', settings: [
          { id: 'colorVisible', label: 'Visible Color', type: 'color', default: '#2ecc71' },
          { id: 'colorHidden', label: 'Hidden Color', type: 'color', default: '#e63946' },

          { id: 'unlockWraps', label: 'Unlock Wraps', type: 'toggle', default: false },

          { id: 'unlockEmotes', label: 'Unlock Emotes', type: 'toggle', default: false },

    sections: {

          { id: 'autoReload', label: 'Auto Reload', type: 'toggle', default: false },
          { id: 'autoSwitch', label: 'Auto Weapon Switch', type: 'toggle', default: false },

let config = {};
let currentPage = 'combat';
let currentSubtab = 0;
let autoSaveTimer = null;
let listeningKeybind = null;

function getDefaults() {
  const d = {};
  for (const page of Object.values(PAGES)) {
    for (const sections of Object.values(page.sections)) {
      for (const sec of sections) {
        for (const s of sec.settings) {
          d[s.id] = s.default;
        }
      }
    }
  }
  return d;
}

function init() {
  config = getDefaults();
  try {
    const saved = localStorage.getItem('phantom_config_default');
    if (saved) { Object.assign(config, JSON.parse(saved)); }
  } catch(e) {}
  renderPage();
  updateStatus();
}

function switchPage(el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
  currentPage = el.dataset.page;
  currentSubtab = 0;
  renderPage();
}

function renderPage() {
  const page = PAGES[currentPage];
  const main = document.getElementById('mainContent');
  const tabName = page.subtabs[currentSubtab];

  let html = '';
  if (page.subtabs.length > 1) {
    html += '<div class="subtabs">';
    page.subtabs.forEach((t, i) => {
      html += `<div class="subtab ${i === currentSubtab ? 'active' : ''}" onclick="currentSubtab=${i};renderPage()">${t}</div>`;
    });
    html += '</div>';
  }

  html += '<div class="settings-grid">';
  const sections = page.sections[tabName] || [];
  for (const sec of sections) {
    html += renderGroup(sec);
  }
  html += '</div>';
  main.innerHTML = html;
  initSliders();
  filterSettings(document.getElementById('searchInput').value);
}

function renderGroup(sec) {
  let html = `<div class="settings-group" data-group>
    <div class="group-header" onclick="toggleGroup(this)">
      <span class="group-title">${sec.group}</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>
    <div class="group-body">`;
  for (const s of sec.settings) {
    html += renderSetting(s);
  }
  html += '</div></div>';
  return html;
}

function renderSetting(s) {
  let control = '';
  switch (s.type) {
    case 'toggle':
      control = `<label class="toggle"><input type="checkbox" ${config[s.id] ? 'checked' : ''} onchange="setSetting('${s.id}', this.checked)"><div class="toggle-track"></div></label>`;
      break;
    case 'slider':
      const pct = ((config[s.id] - s.min) / (s.max - s.min)) * 100;
      control = `<div class="slider-wrap">
        <div class="slider-header"><span class="setting-label">${s.label}</span><span class="slider-value">${config[s.id]}/${s.max}</span></div>
        <div class="slider-track" data-slider data-id="${s.id}" data-min="${s.min}" data-max="${s.max}" data-step="${s.step || 1}">
          <div class="slider-fill" style="width:${pct}%"></div>
          <div class="slider-thumb" style="left:${pct}%"></div>
        </div>
      </div>`;
      return `<div class="setting-row" data-setting="${s.id}" data-label="${s.label.toLowerCase()}">${control}</div>`;
    case 'dropdown':
      control = `<div class="dropdown" data-dropdown>
        <div class="dropdown-btn" onclick="toggleDropdown(this)">${config[s.id]}<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div>
        <div class="dropdown-menu">${s.options.map(o => `<div class="dropdown-option ${o === config[s.id] ? 'selected' : ''}" onclick="selectOption('${s.id}', '${o}', this)">${o}</div>`).join('')}</div>
      </div>`;
      break;
    case 'color':
      control = `<div class="color-swatch" style="background:${config[s.id]}"><input type="color" value="${config[s.id]}" onchange="setSetting('${s.id}', this.value); this.parentElement.style.background=this.value"></div>`;
      break;
    case 'keybind':
      control = `<button class="keybind-btn" onclick="listenKeybind('${s.id}', this)">${config[s.id]}</button>`;
      break;
  }
  return `<div class="setting-row" data-setting="${s.id}" data-label="${s.label.toLowerCase()}">
    <span class="setting-label">${s.label}</span>${control}</div>`;
}

function setSetting(id, val) {
  config[id] = val;
  updateStatus();
  scheduleAutoSave();
}

function scheduleAutoSave() {
  if (!config.autoSave) return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => saveConfig(true), 1500);
}

function toggleGroup(header) {
  header.classList.toggle('collapsed');
  header.nextElementSibling.classList.toggle('hidden');
}

function toggleDropdown(btn) {
  document.querySelectorAll('.dropdown-menu.open').forEach(m => { if (m !== btn.nextElementSibling) m.classList.remove('open'); });
  btn.nextElementSibling.classList.toggle('open');
}

function selectOption(id, val, el) {
  config[id] = val;
  const dd = el.closest('.dropdown');
  dd.querySelector('.dropdown-btn').firstChild.textContent = val;
  dd.querySelectorAll('.dropdown-option').forEach(o => o.classList.toggle('selected', o.textContent === val));
  dd.querySelector('.dropdown-menu').classList.remove('open');
  scheduleAutoSave();
}

function listenKeybind(id, btn) {
  if (listeningKeybind) return;
  listeningKeybind = { id, btn };
  btn.classList.add('listening');
  btn.textContent = '...';
}

document.addEventListener('keydown', e => {
  if (!listeningKeybind) return;
  e.preventDefault();
  const key = e.key === ' ' ? 'Space' : e.key.length === 1 ? e.key.toUpperCase() : e.key;
  config[listeningKeybind.id] = key;
  listeningKeybind.btn.textContent = key;
  listeningKeybind.btn.classList.remove('listening');
  listeningKeybind = null;
  scheduleAutoSave();
});

document.addEventListener('click', e => {
  if (!e.target.closest('.dropdown')) {
    document.querySelectorAll('.dropdown-menu.open').forEach(m => m.classList.remove('open'));
  }
});

function initSliders() {
  document.querySelectorAll('[data-slider]').forEach(track => {
    const update = (clientX) => {
      const rect = track.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const min = +track.dataset.min, max = +track.dataset.max, step = +(track.dataset.step || 1);
      let val = min + pct * (max - min);
      val = Math.round(val / step) * step;
      val = Math.max(min, Math.min(max, val));
      config[track.dataset.id] = val;
      const fillPct = ((val - min) / (max - min)) * 100;
      track.querySelector('.slider-fill').style.width = fillPct + '%';
      track.querySelector('.slider-thumb').style.left = fillPct + '%';
      track.closest('.slider-wrap').querySelector('.slider-value').textContent = `${val}/${max}`;
      scheduleAutoSave();
    };
    const onMove = e => { e.preventDefault(); update(e.clientX); };
    const onUp = () => { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); };
    track.addEventListener('mousedown', e => {
      update(e.clientX);
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
    const onTouchMove = e => { e.preventDefault(); update(e.touches[0].clientX); };
    const onTouchEnd = () => { document.removeEventListener('touchmove', onTouchMove); document.removeEventListener('touchend', onTouchEnd); };
    track.addEventListener('touchstart', e => {
      update(e.touches[0].clientX);
      document.addEventListener('touchmove', onTouchMove, { passive: false });
      document.addEventListener('touchend', onTouchEnd);
    }, { passive: false });
  });
}

function saveConfig(silent) {
  const slot = document.getElementById('configSlot').value;
  try {
    localStorage.setItem('phantom_config_' + slot, JSON.stringify(config));
    if (!silent) showToast('Config saved', 'success');
  } catch(e) {
    if (!silent) showToast('Save failed', 'error');
  }
  updateStatus();
}

function loadConfig(slot) {
  try {
    const saved = localStorage.getItem('phantom_config_' + slot);
    if (saved) {
      config = { ...getDefaults(), ...JSON.parse(saved) };
      renderPage();
      showToast('Config loaded: ' + slot, 'success');
    }
  } catch(e) { showToast('Load failed', 'error'); }
  document.getElementById('configName').textContent = document.getElementById('configSlot').selectedOptions[0].text;
  updateStatus();
}

function resetConfig() {
  config = getDefaults();
  renderPage();
  showToast('Config reset to defaults', 'success');
  scheduleAutoSave();
  updateStatus();
}

function exportConfig() {
  const json = JSON.stringify(config, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'phantom-config.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  showToast('Config exported', 'success');
}

function importConfig() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const imported = JSON.parse(ev.target.result);
        config = { ...getDefaults(), ...imported };
        renderPage();
        showToast('Config imported', 'success');
        scheduleAutoSave();
      } catch(err) { showToast('Invalid config file', 'error'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

function updateStatus() {
  let count = 0;
  for (const [k, v] of Object.entries(config)) {
    if (typeof v === 'boolean' && v && k !== 'autoSave' && k !== 'autoLoad' && k !== 'teamCheck' && k !== 'wallCheck') count++;
  }
  document.getElementById('activeCount').textContent = count + ' active';
  document.getElementById('autoSaveState').textContent = config.autoSave ? 'ON' : 'OFF';
  document.getElementById('autoSaveState').style.color = config.autoSave ? 'var(--green)' : 'var(--fg-muted)';
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (count > 0 ? '' : ' off');
  document.getElementById('statusText').textContent = count > 0 ? 'Active' : 'Standby';
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = 'toast', 2000);
}

function filterSettings(query) {
  query = (query || '').toLowerCase().trim();
  document.querySelectorAll('[data-setting]').forEach(row => {
    if (!query) { row.style.display = ''; return; }
    const label = row.dataset.label || '';
    row.style.display = label.includes(query) ? '' : 'none';
  });
  document.querySelectorAll('[data-group]').forEach(g => {
    const visible = g.querySelectorAll('[data-setting]:not([style*="display: none"])');
    g.style.display = (!query || visible.length > 0) ? '' : 'none';
  });
}

document.getElementById('searchInput').addEventListener('input', e => filterSettings(e.target.value));

init();
</script>
